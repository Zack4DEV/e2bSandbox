[tool.poetry]
name = "e2bSandbox"
version = "1.0.0"
description = "e2b Runtime Sandbox ,Code Interpreting"
authors = ["Zack4DEV <manager@Zeh4DEV.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "./", from = "."}]
repository = "https://github.com/Zack4DEV/e2bSandbox"
homepage = "https://e2b.dev"
keywords = ["ai", "llm"]

classifiers = [
    "Development Status :: 1 - SNAPSHOT",
    "License :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

readme = "README.md"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/legacy/"
priority = "explicit"

[tool.pytest.ini_options]
addopts = "-ra -q --cov=core --no-cov-on-fail --timeout 10"
pythonpath = ["."]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError()"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"
lint.extend-select = ["I"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004"]

