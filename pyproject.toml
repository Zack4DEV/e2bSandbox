ignore = ["E501", "PLR0913", "PLR2004"]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.8.2"
langchain = "^0.2.1"
langchain-openai = "^0.1.0"
crewai = "^0.150.0"
llama-index = "^0.13.1"
ollama = "^0.1.0"
jsonref = "^1.1.0"

[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.1"
e2b-code-interpreter = "^1.5.2"
e2b-desktop = "^0.1.0"
cowsay = "^6.1"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
pytest-asyncio = "^0.23.6"
pytest-timeout = "^2.3.1"
ruff = "^0.3.5"
pre-commit = "^3.7.0"
mypy = "^1.10.0"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["langchain.*", "crewai.*", "llama_index.*", "ollama.*"]
ignore_missing_imports = true

[tool.pdm.dev-dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
mypy = "^1.10.0"
ruff = "^0.3.5"
pre-commit = "^3.7.0"

[tool.pdm.build]
includes = ["src"]

[tool.pdm.scripts]
test = "pytest --cov=src tests/"
post_test = "echo 'Tests completed.'"
lint = "ruff check src/"
typecheck = "mypy src/"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"