name: Bug Report
description: File a bug report
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report!
        
        If you haven't already, please also check our [Frequently Asked Questions](https://github.com/Zack4DEV/e2bSandbox/wiki/Frequently-Asked-Questions) and [currently open issues](https://github.com/Zack4DEV/e2bSandbox/issues/) to see if the problem you have is already mentioned. If so, please comment on the the existing issue instead of creating a new one.

  - type: dropdown
    id: client
    attributes:
      label: Version
      description: Which version of e2b-code-interpreter are you using?
      options:
        - Command-line (Python) version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - Windows 10
        - Windows 11
        - MacOS
        - Ubuntu Linux
        - Linux (other)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Please describe the problem in as much detail as possible. If you have screenshots or screen recordings, please add them - helpful us figure out what's going on.
      placeholder: "When I do [something], [a strange thing or a bug] happens instead of [what I expected]."
    validations:
      required: true