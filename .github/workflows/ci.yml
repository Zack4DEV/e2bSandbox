name: Run unit tests

on:
  push:
    branches: [ "origin" ]
  pull_request:
    branches: [ "origin", "upstream" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Python version 3.14
      run: poetry env use python3.14
    - name: Python version 3.14
      run: poetry lock --no-update
    - name: Install dependencies
      run: |
        python -m pip install poetry 
        poetry install
    - name: Lint with ruff
      run: poetry run ruff check --verbose --output-format github --config ./pyproject.toml ./
    - name: Check code style with black
      run: poetry run ruff format --verbose --preview  --config ./pyproject.toml
    - name: Test with pytest
      run: poetry run pytest --trace --fixtures-per-test
